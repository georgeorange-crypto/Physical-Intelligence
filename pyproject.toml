[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "robot-vla"
version = "0.1.0"
description = "Hardware-isolated VLA development stack for a six-joint Hiwonder arm"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Zicong Chen" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["robotics", "vision-language-action", "lerobot", "hiwonder"]

[project.urls]
Repository = "https://github.com/georgeorange-crypto/Physical-Intelligence"
Issues = "https://github.com/georgeorange-crypto/Physical-Intelligence/issues"
dependencies = [
  "numpy>=2.0,<2.3",
  "opencv-python-headless>=4.9,<4.14",
  "pydantic>=2.7",
  "httpx>=0.27",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]
lerobot = ["lerobot==0.6.1"]
smolvla = ["lerobot[smolvla]==0.6.1"]

[project.scripts]
robot-vla = "robot_vla.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_vla"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not model'"
markers = [
  "model: downloads or loads model checkpoints and requires GPU/network",
  "lerobot: requires the optional LeRobot dataset and plugin dependencies",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
